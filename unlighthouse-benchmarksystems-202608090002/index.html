<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <style>
  button[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
  }
  </style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Use Benchmark Systems logo as favicon -->
  <link rel="icon" href="https://www.benchmarksystems.com/wp-content/themes/accel434/assets/images/logo.png" type="image/png">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=DM+Serif+Display:ital@0;1&display=swap">
  <title>Benchmark Systems — Performance Report</title>

  <!-- Inline script: replace Unlighthouse branding/logo and disable all navigation links so the page is a whitelisted, single-view report -->
  <script>
    (function(){
      const LOGO_URL = 'https://www.benchmarksystems.com/wp-content/themes/accel434/assets/images/logo.png';

      // Replace any existing favicon links (if present)
      try{
        document.querySelectorAll('link[rel~="icon"]').forEach(l=>{ l.href = LOGO_URL; l.type='image/png'; });
      }catch(e){}

      // Prevent navigation: remove hrefs and disable pointer events on anchors
      function disableLinks(){
        document.querySelectorAll('a').forEach(a=>{
          try{ a.removeAttribute('href'); }catch(e){}
          a.style.pointerEvents = 'none';
          a.style.cursor = 'default';
        });
      }

      // Replace images named like 'logo' with the provided logo
      function replaceLogos(){
        document.querySelectorAll('img').forEach(img=>{
          try{
            if(img.src && /logo/i.test(img.src)) img.src = LOGO_URL;
          }catch(e){}
        });
      }

      // Observe DOM changes so dynamically injected logos/links are handled
      const observer = new MutationObserver(()=>{ replaceLogos(); disableLinks(); });
      observer.observe(document.documentElement, { childList:true, subtree:true, attributes:true, attributeFilter:['src','href'] });

      // Global click preventer to be extra-safe
      document.addEventListener('click', e=>{ const a = e.target.closest && e.target.closest('a'); if(a) e.preventDefault(); }, true);

      // Run immediately too
      if(document.readyState === 'complete' || document.readyState === 'interactive'){ replaceLogos(); disableLinks(); }
      else document.addEventListener('DOMContentLoaded', ()=>{ replaceLogos(); disableLinks(); });
    })();
  </script>

  <script data-unlighthouse-inline>
  window.__unlighthouse_static = false
  // boilerplate options to run the client by itself
  </script>
  <script data-unlighthouse-payload src="assets/payload.js"></script>
  <style>
  /* scroll bars courtesy of https://antfu.me/ */
  :root {
    --c-bg: #fff;
    --c-scrollbar: #eee;
    --c-scrollbar-hover: #bbb
  }

  html.dark {
    --c-bg: #050505;
    --c-scrollbar: #111;
    --c-scrollbar-hover: #222
  }

  * {
    scrollbar-color: var(--c-scrollbar) var(--c-bg)
  }

  ::-webkit-scrollbar {
    width: 6px
  }

  ::-webkit-scrollbar:horizontal {
    height: 6px
  }

  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner {
    background: var(--c-bg);
    border-radius: 10px
  }

  ::-webkit-scrollbar-thumb {
    background: var(--c-scrollbar);
    border-radius: 10px
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--c-scrollbar-hover)
  }
  </style>
  <script type="module" crossorigin src="assets/index-CGj_ix7-.js"></script>
  <link rel="stylesheet" crossorigin href="assets/index-BoWfaWMc.css">
</head>
<body class="dark:bg-[#020617]">
<div id="app"></div>
<script>
(function () {
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
  const setting = localStorage.getItem('color-schema') || 'auto'
  if (setting === 'dark' || (prefersDark && setting !== 'light'))
    document.documentElement.classList.toggle('dark', true)

  // document.title = __unlighthouse_data.options.host.replace(/https?:\/\/(www.)?/, '') + ' | Unlighthouse'
})()
</script>
</body>
</html>
